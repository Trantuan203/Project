databases:
  - name: kaijumess-db
    plan: free

services:
  - type: web
    name: kaijumess-server
    runtime: node
    rootDir: Kaijumess-server
    buildCommand: npm install
    startCommand: npm run start
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kaijumess-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
